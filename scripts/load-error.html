<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bağlantı Hatası</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0f1115;color:#e8eaf0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.card{max-width:480px;text-align:center}
h1{font-size:22px;margin:0 0 12px;font-weight:600}
p{font-size:15px;line-height:1.6;color:#b9bec9;margin:0 0 10px}
.hint{font-size:13px;color:#8a90a0}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Siteye ulaşılamadı</h1>
<p>openani.me yüklenemedi. İnternet bağlantınızı kontrol edin.</p>
<p class="hint">Bağlantınız düzeldiğinde uygulamayı kapatıp yeniden açın.</p>
</div>
</div>
</body>
</html>
