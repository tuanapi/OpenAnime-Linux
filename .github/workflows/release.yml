name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Build Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --linux AppImage deb rpm tar.gz pacman

      - name: Create Portable Zip
        run: cd dist && zip -r OpenAnime-${{ github.ref_name }}-portable.zip linux-unpacked/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.gz
            dist/*-portable.zip
            dist/*.yml
            dist/*.blockmap
          generate_release_notes: true
          body: |
            ## Sürüm 1.1.4 Yenilikleri
            - **DRI_PRIME İyileştirmesi:** Tek GPU'lu sistemlerde `DRI_PRIME=1` set edildiğinde Mesa sürücüsünün verdiği "Inconsistent value" uyarısı giderildi. Artık sistemdeki GPU sayısı taranarak offload işlemi dinamik yapılıyor.
            - **Discord RPC İyileştirmeleri:** Ok tuşlarıyla (klavye) video ileri/geri sarıldığında Discord senkronizasyonunun bozulması sorunu çözüldü. Önceki sürümdeki tüm kararlılık düzeltmeleri korunuyor.

            ## 📥 İndirme Seçenekleri
            - **AppImage (`.AppImage`):** Tek tıkla çalışır, kurulum gerektirmez. (Tüm Linux dağıtımları için önerilir)
            - **Arch Linux (`.pacman`):** Arch Linux, Manjaro, EndeavourOS vb. sistemler için yerel paket.
            - **Debian/Ubuntu (`.deb`):** Debian, Ubuntu, Linux Mint, Pop!_OS vb. için kurulum paketi.
            - **Fedora/RHEL (`.rpm`):** Fedora, openSUSE, RHEL tabanlı sistemler için kurulum paketi.
            - **Portable (`.zip` / `.tar.gz`):** Arşivi klasöre çıkartın ve doğrudan `openanime` dosyasını çalıştırın.
