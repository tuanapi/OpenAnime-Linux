name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --linux

      - name: Create Portable Zip
        run: cd dist && zip -r OpenAnime-${{ github.ref_name }}-portable.zip linux-unpacked/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*-portable.zip
            dist/*.yml
            dist/*.blockmap
          body: |
            ## Sürüm Notları (${{ github.ref_name }})
            
            • **Gelişmiş Yapılandırma:** `config.json` dosyası artık daha düzenli ve stabil.
            • **Yüksek Performans Modu:** Hibrit GPU/Eski PC sistemleri için `highPerformance` seçeneği eklendi.
            • **Otomatik Yapılandırma:** Eksik config dosyası artık açıklamalarla birlikte otomatik oluşturuluyor.
            • **Discord RPC:** Geliştirilmiş hata yönetimi ve bağlantı iyileştirmeleri.
            • **Hata Düzeltmeleri:** Genel performans ve pencere yönetimi iyileştirmeleri.

            ## İndirme
            - **AppImage:** Tek dosya, kurulum gerektirmez. (Arch, Fedora, Ubuntu vb.)
            - **Deb:** Debian, Ubuntu, Linux Mint vb. için kurulum paketi.
            - **RPM:** Fedora, RHEL, openSUSE vb. için kurulum paketi.
            - **Portable Zip:** Arşivi aç, `linux-unpacked/openanime` dosyasını çalıştır.
