name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  # One group for the whole repo, not one per ref. Every run rewrites the same
  # gh-pages branch, and a per-ref group let a tag build and a workflow_dispatch
  # push concurrently, where the loser failed on a non-fast-forward. Serialising
  # releases is cheap: they are sequential by nature.
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax Check
        run: |
          for f in main.js preload.js injected.js launcher.js scripts/*.js; do
            node --check "$f" || exit 1
          done

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Build Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # fpm stamps generated files -- including usr/share/doc/*/changelog.gz
          # inside the deb -- with the current time unless SOURCE_DATE_EPOCH is
          # set. That made every rebuild of the same commit produce a different
          # deb, so the copy in the apt repo never matched the release asset.
          # Pinning it to the commit timestamp makes a build reproducible per
          # revision: same commit in, byte-identical packages out.
          #
          # Derived from git rather than github.event.head_commit.timestamp,
          # because that expression is an ISO-8601 string on push and absent on
          # workflow_dispatch, and fpm parses this value with Integer() -- an
          # ISO string would silently become 2026.
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH ($(git log -1 --format=%cI))"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          npm run dist -- --linux AppImage deb rpm tar.gz pacman

      - name: Create Portable Zip
        run: cd dist && zip -r OpenAnime-${{ github.ref_name }}-portable.zip linux-unpacked/

      - name: Generate Checksums
        run: |
          cd dist
          rm -f CHECKSUMS.txt
          sha256sum \
            *.AppImage *.deb *.rpm *.pacman *.tar.gz *-portable.zip \
            > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.gz
            dist/*-portable.zip
            dist/latest-linux.yml
            dist/CHECKSUMS.txt
          body_path: RELEASE_NOTES.md

      - name: Install Repository Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c pacman-package-manager dnf dnf-plugins-core

      - name: Import Repository Signing Key
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          REPO_GPG_KEY_ID: ${{ secrets.REPO_GPG_KEY_ID }}
        run: |
          if [ -z "$REPO_GPG_PRIVATE_KEY" ] || [ -z "$REPO_GPG_KEY_ID" ]; then
            echo "::notice title=Repository metadata skipped::REPO_GPG_PRIVATE_KEY / REPO_GPG_KEY_ID secrets are not set"
            echo "SKIP_REPO=1" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$REPO_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --keyid-format LONG "$REPO_GPG_KEY_ID"

      - name: Seed Repository Pool
        if: env.SKIP_REPO != '1'
        run: |
          # Pull the packages already on gh-pages down flat, so build-repo.sh can
          # merge them into the pool *before* it generates any index. Fetching
          # them after generation put them in the pool with no metadata pointing
          # at them: files a client could see but never install.
          rm -rf pool-seed
          mkdir -p pool-seed
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git ls-tree -r --name-only FETCH_HEAD -- apt/pool rpm pacman \
              | grep -E '\.(deb|rpm|pkg\.tar\.[a-z]+)$' \
              | while IFS= read -r path; do
                  git show "FETCH_HEAD:$path" > "pool-seed/$(basename "$path")"
                done
          fi
          echo "seeded $(find pool-seed -type f | wc -l) package(s) from gh-pages"
          find pool-seed -type f | sort

      - name: Generate Repository Metadata
        if: env.SKIP_REPO != '1'
        env:
          REPO_GPG_KEY_ID: ${{ secrets.REPO_GPG_KEY_ID }}
        run: |
          bash scripts/repo/build-repo.sh dist repo-site OpenAnime "$REPO_GPG_KEY_ID" pool-seed
          cp packaging/repo/openanime-repo.asc repo-site/openanime-repo.asc
          find repo-site -type f | sort

      - name: Verify Repository Signatures
        if: env.SKIP_REPO != '1'
        run: |
          gpg --verify repo-site/apt/dists/stable/InRelease
          gpg --verify repo-site/apt/dists/stable/Release.gpg repo-site/apt/dists/stable/Release
          gpg --verify repo-site/rpm/repodata/repomd.xml.asc repo-site/rpm/repodata/repomd.xml
          gpg --verify repo-site/pacman/openanime.db.sig repo-site/pacman/openanime.db.tar.gz
            for sig in repo-site/pacman/*.pkg.tar.xz.sig; do
              gpg --verify "$sig" "${sig%.sig}"
            done

      - name: Smoke Test APT
        if: env.SKIP_REPO != '1'
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          gpg --batch --yes --dearmor -o /tmp/openanime.gpg packaging/repo/openanime-repo.asc
          sudo install -m 0644 /tmp/openanime.gpg /etc/apt/keyrings/openanime.gpg
          printf 'deb [signed-by=/etc/apt/keyrings/openanime.gpg] file://%s/repo-site/apt stable main\n' "$PWD" \
            | sudo tee /etc/apt/sources.list.d/openanime-selftest.list
          sudo apt-get update
          apt-cache policy openanime
          sudo apt-get install -y --download-only openanime
          sudo rm -f /etc/apt/sources.list.d/openanime-selftest.list

      - name: Smoke Test DNF
        if: env.SKIP_REPO != '1'
        run: |
          sudo rpm --import packaging/repo/openanime-repo.asc
          # -y is load-bearing, not a convenience flag. dnf keeps a per-repository
          # pubring under /var/cache/dnf and populates it from an interactive
          # "Is this ok [y/N]:" prompt. `rpm --import` does not feed it, by
          # design (RHBZ 1768206). On a runner there is no TTY, so the prompt
          # defaults to No, the key is never accepted, and dnf reports the
          # misleading "repomd.xml GPG signature verification error: Bad GPG
          # signature" rather than anything about a missing key. -y accepts the
          # configured gpgkey= without prompting.
          #
          # gpgkey= is required too: it is how dnf learns which key to import,
          # and --repofrompath defines the repo inline without one.
          sudo dnf -y --disablerepo='*' \
            --repofrompath=openanime,"file://$PWD/repo-site/rpm" \
            --setopt=openanime.gpgcheck=0 \
            --setopt=openanime.repo_gpgcheck=1 \
            --setopt=openanime.gpgkey="file://$PWD/packaging/repo/openanime-repo.asc" \
            repoquery --qf '%{name}-%{version}-%{release}.%{arch}' openanime
          mkdir -p "$RUNNER_TEMP/dnf-probe"
          sudo dnf -y --disablerepo='*' \
            --repofrompath=openanime,"file://$PWD/repo-site/rpm" \
            --setopt=openanime.gpgcheck=0 \
            --setopt=openanime.repo_gpgcheck=1 \
            --setopt=openanime.gpgkey="file://$PWD/packaging/repo/openanime-repo.asc" \
            download --downloaddir="$RUNNER_TEMP/dnf-probe" openanime
          ls -l "$RUNNER_TEMP/dnf-probe"

      - name: Smoke Test Pacman
        if: env.SKIP_REPO != '1'
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg-smoke"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          gpg --batch --quiet --import packaging/repo/openanime-repo.asc
          printf '%s:6:\n' "$(gpg --show-keys --with-colons --fingerprint packaging/repo/openanime-repo.asc | awk -F: '/^fpr:/{print $10; exit}')" \
            | gpg --batch --import-ownertrust
          mkdir -p "$RUNNER_TEMP/pac/db" "$RUNNER_TEMP/pac/cache"
          printf '[options]\nArchitecture = x86_64\nDBPath = %s\nCacheDir = %s\nGPGDir = %s\n\n[openanime]\nServer = file://%s/repo-site/pacman\nSigLevel = Required DatabaseRequired\n' \
            "$RUNNER_TEMP/pac/db" "$RUNNER_TEMP/pac/cache" "$GNUPGHOME" "$PWD" \
            > "$RUNNER_TEMP/pac/pacman.conf"
          sudo pacman --config "$RUNNER_TEMP/pac/pacman.conf" -Sy
          sudo pacman --config "$RUNNER_TEMP/pac/pacman.conf" -Sl openanime
          sudo pacman --config "$RUNNER_TEMP/pac/pacman.conf" -Sp openanime || true

      - name: Publish Repository to gh-pages
        if: env.SKIP_REPO != '1'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
            git rm -rfq --cached . 2>/dev/null || true
            mv repo-site "$RUNNER_TEMP/keep-site"
            rm -rf ./* ./.github ./.gitignore
            mv "$RUNNER_TEMP/keep-site" ./repo-site
          fi
          # The pool already carries every previously published package, because
          # build-repo.sh merged them in before generating the indexes. Copying
          # them here as well would re-add files that no index references.
          cp -a repo-site/. .
          rm -rf repo-site
          git add -A apt rpm pacman openanime-repo.asc
          git commit -m "repo: publish metadata for ${TAG:-manual}" || echo "nothing new to publish"
          git push origin gh-pages

  nix-check:
    runs-on: ubuntu-latest
    # Doesn't block or gate the release above — Nix support is new and this
    # job exists to surface breakage visibly, not to hold up the AppImage/
    # deb/rpm release (the primary distribution path) if the flake breaks.
    #
    # npmDepsHash was refreshed for electron 44.5.1 / @xhayper/discord-rpc
    # 1.5.1 with:
    #   nix run nixpkgs#prefetch-npm-deps -- package-lock.json
    # Refresh it the same way whenever package-lock.json changes, or this job
    # goes red on the fixed-output hash mismatch.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check flake
        run: nix flake check

      - name: Build Nix package
        run: nix build .#default -L
