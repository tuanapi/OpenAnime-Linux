name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --linux

      - name: Create Portable Zip
        run: cd dist && zip -r OpenAnime-${{ github.ref_name }}-portable.zip linux-unpacked/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*-portable.zip
            dist/*.yml
            dist/*.blockmap
          body: |
            ## Sürüm Notları (v1.0.7)
            - **Derin Bağlantı Desteği:** `openanime://` protokolü sisteme eklendi. Tarayıcıdan uygulamanın açılmasını sağlar.
            - **Dinamik Kontroller:** Pencere yönetim butonları (kapat/küçült) fare inaktif olduğunda otomatik kaybolur.
            - **Performans:** Uygulama donanım hızlandırma için her zaman harici ekran kartını (dGPU) tercih edecek şekilde yapılandırıldı.

            ## İndirme
            - **AppImage:** Tek dosya, kurulum gerektirmez. İndir > Çalıştır.
            - **Deb:** Debian, Ubuntu, Linux Mint vb. için kurulum paketi. `sudo dpkg -i` ile kurun.
            - **Portable Zip:** Arşivi aç, `linux-unpacked/openanime` dosyasını çalıştır.
