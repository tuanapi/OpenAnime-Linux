name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --linux

      - name: Create Portable Zip
        run: cd dist && zip -r OpenAnime-${{ github.ref_name }}-portable.zip linux-unpacked/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*-portable.zip
            dist/*.yml
            dist/*.blockmap
          body: |
            ## Sürüm Notları (${{ github.ref_name }})
            
            • **Discord Zengin Varlık (RPC):** Artık ne izlediğiniz profilde detaylı ve doğal bir Türkçe ile görünür.
            • **Pencere Hafızası:** Uygulama kapandığı anki boyutunu ve konumunu hatırlar.
            • **MacOS Tarzı Kontroller:** Sol üst köşeye alınan kontroller, otomatik gizlenme ve tıklama iyileştirmeleriyle optimize edildi.
            • **Tam Ekran Koruma:** Bölüm geçişlerinde tam ekrandan çıkma sorunu giderildi.
            • **Hata Düzeltmeleri:** Discord kapalıyken çökme sorunu giderildi ve bağlantı iyileştirmeleri yapıldı.

            ## İndirme
            - **AppImage:** Tek dosya, kurulum gerektirmez. İndir > Çalıştır.
            - **Deb:** Debian, Ubuntu, Linux Mint vb. için kurulum paketi. `sudo dpkg -i` ile kurun.
            - **Portable Zip:** Arşivi aç, `linux-unpacked/openanime` dosyasını çalıştır.
