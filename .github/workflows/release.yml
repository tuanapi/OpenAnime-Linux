name: Build & Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax Check
        run: |
          for f in main.js preload.js injected.js launcher.js scripts/*.js; do
            node --check "$f" || exit 1
          done

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Build Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --linux AppImage deb rpm tar.gz pacman

      - name: Create Portable Zip
        run: cd dist && zip -r OpenAnime-${{ github.ref_name }}-portable.zip linux-unpacked/

      - name: Generate Checksums
        run: |
          cd dist
          rm -f CHECKSUMS.txt
          sha256sum \
            *.AppImage *.deb *.rpm *.pacman *.tar.gz *-portable.zip *.yml \
            > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.gz
            dist/*-portable.zip
            dist/*.yml
            dist/CHECKSUMS.txt
          body_path: RELEASE_NOTES.md

  nix-check:
    runs-on: ubuntu-latest
    # Doesn't block or gate the release above — Nix support is new and this
    # job exists to surface breakage visibly, not to hold up the AppImage/
    # deb/rpm release (the primary distribution path) if the flake breaks.
    #
    # NOTE: flake.nix's npmDepsHash is stale as of the 1.1.8 dependency bump
    # (electron 44.5.1, @xhayper/discord-rpc 1.5.1). Refresh it before tagging
    # or this job goes red:
    #   nix build .#default --no-link --print-out-paths   # then update the hash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check flake
        run: nix flake check

      - name: Build Nix package
        run: nix build .#default -L
