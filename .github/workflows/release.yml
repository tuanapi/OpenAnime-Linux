name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Build Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --linux AppImage deb rpm tar.gz pacman

      - name: Create Portable Zip
        run: cd dist && zip -r OpenAnime-${{ github.ref_name }}-portable.zip linux-unpacked/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.gz
            dist/*-portable.zip
            dist/*.yml
            dist/*.blockmap
          generate_release_notes: true
          body: |
            ## Sürüm 1.1.7 Yenilikleri
            - **GPU Yolları Birleşti:** dGPU-ekranlı sistemler native Wayland'de (H.265 donanım decode dahil), iGPU-ekranlı NVIDIA hibritler otomatik X11 (XWayland) altında çalışıyor. Yol, topolojiye göre otomatik seçiliyor; `forceX11` ayarı kaldırıldı.
            - **iGPU Çökmesi Düzeltildi:** Wayland'de GBM (iGPU) + Vulkan (NVIDIA) karışımı GPU sürecini H.265 oynatırken çökertiyordu (gallium SEGV). X11 yolunda GL de NVIDIA'ya taşınıyor: tek cihaz.
            - **GPU Algılama:** `scripts/gpu-detect.js` — PCI vendor/device tabloları, VRAM ve bus sezgisi, NVIDIA-eleme kuralı; `node scripts/gpu-detect.js --self-test` ile 11 topoloji doğrulanıyor.
            - **Tanı Modu:** `OpenAnime --diagnose` / `npm run diagnose` — WebGPU adaptörü + gerçek fps ölçer, `DIAG_JSON` çıktısını issue'lara yapıştırın.
            - **Electron 44.4.x:** Chromium 152, Node 24.
            - **Nix/NixOS Desteği:** `flake.nix` — `nix run github:tuanapi/OpenAnime-Linux`.
            - **Güvenlik:** Bağımlılıklar güncellendi — bilinen 15 güvenlik açığının tamamı giderildi.

            ⚠️ *Bu sürümdeki GPU/ekran algılama değişiklikleri henüz geniş kullanıcı kitlesinde doğrulanmadı. Sorun yaşarsanız lütfen bildirin.*

            ### Bilinen Sorunlar (Known Issues)
            - iGPU-ekranlı NVIDIA hibritlerde uygulama XWayland altında açılır (otomatik); bu beklenen davranıştır, Wayland zorlaması için bir ayar yoktur.

            ## 📥 İndirme Seçenekleri
            - **AppImage (`.AppImage`):** Tek tıkla çalışır, kurulum gerektirmez. (Tüm Linux dağıtımları için önerilir)
            - **Arch Linux (`.pacman`):** Arch Linux, Manjaro, EndeavourOS vb. sistemler için yerel paket.
            - **Debian/Ubuntu (`.deb`):** Debian, Ubuntu, Linux Mint, Pop!_OS vb. için kurulum paketi.
            - **Fedora/RHEL (`.rpm`):** Fedora, openSUSE, RHEL tabanlı sistemler için kurulum paketi.
            - **Nix/NixOS:** `nix run github:tuanapi/OpenAnime-Linux` — ayrı indirme gerekmez, `flake.nix` repoda.
            - **Portable (`.zip` / `.tar.gz`):** Arşivi klasöre çıkartın ve doğrudan `openanime` dosyasını çalıştırın.

  nix-check:
    runs-on: ubuntu-latest
    # Doesn't block or gate the release above — Nix support is new and this
    # job exists to surface breakage visibly, not to hold up the AppImage/
    # deb/rpm release (the primary distribution path) if the flake breaks.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check flake
        run: nix flake check

      - name: Build Nix package
        run: nix build .#default -L
